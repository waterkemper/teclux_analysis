<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTÓTIPO — Manutenção de Preços · F8</title>
  <style>
    :root{--ink:#1f2937;--muted:#64748b;--line:#d8dee8;--bg:#f5f6f8;--card:#fff;--blue:#155e75;--blue2:#e6f5f8;--green:#166534;--green2:#ecfdf3;--amber:#92400e;--amber2:#fff7ed;--red:#b42318;--red2:#fff1f0;--shadow:0 1px 3px #0f172a14}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,Segoe UI,Arial,sans-serif} button,input,select{font:inherit} button{cursor:pointer}.app{min-height:100vh}.top{height:48px;background:#173a45;color:white;display:flex;align-items:center;padding:0 18px;gap:14px}.brand{font-weight:800;letter-spacing:.4px}.crumb{opacity:.76;font-size:12px}.page{padding:14px 16px 78px}.titleline{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}.titleline h1{font-size:20px;margin:0 0 3px}.titleline p{margin:0;color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}.bblue{background:var(--blue2);color:var(--blue)}.bgreen{background:var(--green2);color:var(--green)}.bamber{background:var(--amber2);color:var(--amber)}.toolbar{background:white;border:1px solid var(--line);border-radius:8px;padding:7px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow)}.btn{border:1px solid #cbd5e1;background:white;border-radius:6px;padding:7px 10px;font-weight:650;color:#334155}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red);border-color:#f4b4ad}.btn:disabled{opacity:.45}.spacer{flex:1}.meta{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.filters{padding:11px}.filter-grid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px}.field label{display:block;color:#475569;font-size:11px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;height:30px;border:1px solid #cbd5e1;border-radius:5px;padding:4px 7px;background:white}.sections{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.chip{border:1px solid #cbd5e1;border-radius:999px;padding:5px 9px;background:#f8fafc;color:#475569}.tabs{display:flex;border-bottom:1px solid var(--line);gap:2px}.tab{border:0;background:transparent;padding:10px 13px;color:#64748b;font-weight:700}.tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}.workspace{margin-top:10px}.grid-shell{overflow:auto;max-height:59vh;border:1px solid var(--line);border-radius:7px;background:white}.price-grid{border-collapse:separate;border-spacing:0;min-width:1420px;width:100%;font-size:12px}.price-grid th{position:sticky;top:0;z-index:3;background:#eef2f6;color:#334155;border-bottom:1px solid #cbd5e1;border-right:1px solid #dbe2ea;padding:7px 6px;text-align:left;white-space:nowrap}.price-grid td{border-bottom:1px solid #e6eaf0;border-right:1px solid #eef1f5;padding:6px;white-space:nowrap;background:white}.price-grid tr:hover td{background:#f8fbfc}.price-grid .sticky1{position:sticky;left:0;z-index:2}.price-grid .sticky2{position:sticky;left:34px;z-index:2}.price-grid th.sticky1,.price-grid th.sticky2{z-index:5}.price-grid .sticky1{width:34px;min-width:34px}.price-grid .sticky2{width:250px;min-width:250px}.price-grid input[type=number]{width:82px;border:1px solid #cbd5e1;border-radius:4px;padding:4px;text-align:right}.changed{background:#fff8db!important}.old{color:#94a3b8;text-decoration:line-through;margin-right:5px}.new{color:var(--green);font-weight:800}.grouphead{text-align:center!important;background:#dde7ec!important}.statusbar{display:flex;gap:14px;align-items:center;padding:8px 10px;background:#f8fafc;border-top:1px solid var(--line);color:#475569}.side-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:10px}.sidebar{padding:11px;max-height:76vh;overflow:auto}.sidebar h3{font-size:13px;margin:13px 0 7px;border-bottom:1px solid var(--line);padding-bottom:5px}.sidebar h3:first-child{margin-top:0}.sidebar .field{margin-bottom:8px}.compact-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.review{border-left:4px solid #f59e0b;background:#fffaf0;padding:9px 11px;display:flex;gap:12px;align-items:center;margin:8px 0}.review strong{color:#7c2d12}.drawer{display:none;position:fixed;right:0;top:48px;bottom:0;width:390px;background:white;border-left:1px solid var(--line);box-shadow:-12px 0 30px #0f172a20;z-index:20;padding:14px;overflow:auto}.drawer.open{display:block}.drawer h2{margin:0 0 12px}.overlay{display:none;position:fixed;inset:48px 0 0;background:#0f172a38;z-index:19}.overlay.open{display:block}.command-center{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.summary{padding:11px}.summary h3{margin:0 0 9px}.summary-item{padding:8px 0;border-bottom:1px solid #edf0f3}.summary-item:last-child{border:0}.summary-item b{display:block}.review-panel{position:sticky;top:8px}.switcher{position:fixed;z-index:50;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#111827;color:white;border-radius:999px;padding:7px 10px;box-shadow:0 8px 30px #0f172a55}.switcher button{width:31px;height:31px;border-radius:50%;border:1px solid #64748b;background:#273449;color:white}.switcher strong{min-width:210px;text-align:center}.prototype{font-size:10px;color:#fbbf24;letter-spacing:.8px}.hide{display:none!important}@media(max-width:900px){.filter-grid{grid-template-columns:repeat(2,1fr)}.side-layout,.command-center{grid-template-columns:1fr}.sidebar{max-height:none}.review-panel{position:static}.page{padding-left:8px;padding-right:8px}}
    .triple-grid{display:flex;align-items:stretch;gap:8px;min-width:1220px;overflow-x:auto}
    .grid-pane{min-width:300px;width:32%;resize:horizontal;overflow:auto;position:relative;border-right:3px solid #94a3b8}.grid-pane:nth-child(2){min-width:420px;width:35%}.grid-pane:nth-child(3){min-width:460px;width:38%;flex:1}.grid-pane:after{content:'⋮';position:absolute;right:-1px;top:50%;color:white;background:#64748b;border-radius:4px;padding:8px 1px;pointer-events:none}.grid-title{padding:6px 8px;background:#e8edf2;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;font-weight:800;color:#334155}.grid-pane .grid-shell{border-radius:0 0 6px 6px;max-height:58vh}.grid-pane table{min-width:100%}.grid-pane tr.active td{background:#dff3f7!important}.grid-pane tr.changed-row td{box-shadow:inset 0 0 0 999px #fff8db55}
    /* Variante escolhida: operações e revisão usam modal, sem ocupar a área do grid. */
    .drawer{right:auto;top:50%;bottom:auto;left:50%;width:min(620px,calc(100vw - 32px));max-height:82vh;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 70px #0f172a55}
    .overlay{background:#0f172a70}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><span class="brand">tecLUX ERP</span><span class="crumb">Estoque / Manutenção de Preços</span><span class="spacer"></span><span class="prototype">PROTÓTIPO DESCARTÁVEL</span></header>
  <main id="root" class="page"></main>
</div>
<div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"></aside>
<nav class="switcher"><button id="prev">←</button><strong id="variantLabel"></strong><button id="next">→</button></nav>
<script>
const variants={A:'Etapas: filtros → dados',B:'Mesa: filtros laterais',C:'Grid primeiro + revisão'};
const rows=[
 {id:1,produto:'100234 · Cadeira Luna Azul',faixa:'Varejo',estoque:18,normal:499,promo:449,validade:'31/08/2026',cargo:426.55,margem:38.4,desc:5,changed:false},
 {id:2,produto:'100235 · Cadeira Luna Cinza',faixa:'Varejo',estoque:7,normal:499,promo:449,validade:'31/08/2026',cargo:426.55,margem:36.9,desc:5,changed:false},
 {id:3,produto:'100411 · Mesa Íris 160 cm',faixa:'Varejo',estoque:3,normal:1299,promo:1169,validade:'15/09/2026',cargo:1110.55,margem:42.1,desc:5,changed:true},
 {id:4,produto:'100512 · Aparador Nilo',faixa:'Atacado',estoque:0,normal:779,promo:0,validade:'',cargo:740.05,margem:31.2,desc:5,changed:false},
 {id:5,produto:'100688 · Poltrona Serena',faixa:'Varejo',estoque:12,normal:899,promo:809,validade:'31/08/2026',cargo:768.55,margem:44.6,desc:5,changed:true},
 {id:6,produto:'100701 · Banco Alto Lume',faixa:'Atacado',estoque:24,normal:319,promo:289,validade:'31/08/2026',cargo:274.55,margem:29.8,desc:5,changed:false},
];
const selected=new Set([1,2,3]); let active='A';
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function title(){return `<div class="titleline"><div><h1>Manutenção de Preços</h1><p>Preços internos por Filial, Promoções e descontos por Cargo.</p></div><div><span class="badge bblue">Filial 1 · Matriz</span></div></div>`}
function toolbar(extra=''){return `<div class="toolbar"><button class="btn primary" onclick="fakeGenerate()">Gerar <small>F6</small></button><button class="btn" onclick="toggleDrawer('ops')">Operações em lote</button><button class="btn" onclick="recalc()">Recalcular</button><button class="btn" onclick="undo()">Desfazer</button><span class="spacer"></span>${extra}<span class="meta"><b id="pendingCount">2</b> alterações pendentes</span><button class="btn primary" onclick="toggleDrawer('review')">Revisar e gravar <small>F8</small></button></div>`}
function filters(compact=false){return `<div class="${compact?'':'card filters'}"><div class="${compact?'':'filter-grid'}">
 <div class="field"><label>Filial de preço</label><select><option>1 · Matriz</option></select></div><div class="field"><label>Coluna</label><select><option>Todas</option><option>Normal</option><option>Promoção</option></select></div>
 <div class="field"><label>Produto</label><input placeholder="Código ou descrição"></div><div class="field"><label>Grupo</label><input placeholder="Todos"></div><div class="field"><label>Fornecedor</label><input placeholder="Todos"></div><div class="field"><label>Situação</label><select><option>Ativos e em linha</option></select></div></div>
 ${compact?'':`<div class="sections"><button class="chip">+ Característica / Classe / Marca</button><button class="chip">+ Movimento</button><button class="chip">+ Nota fiscal de entrada</button><button class="chip">+ Estoque e Promoção</button><span class="spacer"></span><span class="badge bgreen">6 registros no exemplo</span></div>`}</div>`}
function table(){const tr=(r,kind)=>{const cls=`sync-row ${r.id===1?'active':''} ${r.changed?'changed-row':''}`;const click=`onclick="activateRow(${r.id})"`;if(kind==='id')return `<tr class="${cls}" data-id="${r.id}" ${click}><td><b>${r.produto}</b><br><span class="meta">Faixa ${r.faixa}</span></td><td>${r.estoque}</td></tr>`;if(kind==='commercial')return `<tr class="${cls}" data-id="${r.id}" ${click}><td>${r.faixa}</td><td>Estofados</td><td>Luna</td><td>A</td><td>${money(r.normal*.62)}</td><td>${r.margem.toFixed(2)}%</td></tr>`;return `<tr class="${cls}" data-id="${r.id}" ${click}><td><input type="checkbox" ${selected.has(r.id)?'checked':''} onchange="selectRow(${r.id},this.checked)"></td><td>${money(r.normal)}</td><td class="${r.changed?'changed':''}">${r.changed?`<span class="old">${money(r.promo)}</span><span class="new">${money(r.promo-20)}</span>`:money(r.promo)}</td><td>${r.validade||'—'}</td><td>${money(r.cargo)}</td><td>${r.margem.toFixed(2)}%</td><td><input type="number" value="${r.desc}" onchange="markChanged(${r.id},this)"></td></tr>`};const pane=(title,kind,head)=>`<section class="grid-pane"><div class="grid-title">${title}</div><div class="grid-shell sync-scroll"><table class="price-grid"><thead>${head}</thead><tbody>${rows.map(r=>tr(r,kind)).join('')}</tbody></table></div></section>`;return `<div class="triple-grid">${pane('1 · Produtos e grades','id','<tr><th>Produto / item / descrição / grades</th><th>Estoque</th></tr>')}${pane('2 · Classificação, custo e formação','commercial','<tr><th>Faixa</th><th>Grupo / classe</th><th>Marca</th><th>ABC</th><th>Últ. compra</th><th>Margem</th></tr>')}${pane('3 · Colunas de preço e Cargos','prices','<tr><th>Alterar</th><th>Normal</th><th>Promoção atual → proposta</th><th>Validade</th><th>Cargo</th><th>Margem</th><th>Desc. %</th></tr>')}</div><div class="statusbar"><b id="selCount">${selected.size} selecionados</b><span>6 registros · três visões sincronizadas · sem paginação</span><span class="spacer"></span><span>A linha ativa acompanha a navegação nos três grids</span></div>`}
function reviewBox(){return `<div class="card summary review-panel"><h3>Revisão da sessão</h3><div class="summary-item"><b>2 células alteradas</b><span class="meta">Preço Promoção em 2 Produtos</span></div><div class="summary-item"><b>3 linhas selecionadas</b><span class="meta">Prontas para novas operações</span></div><div class="summary-item"><b>0 erros · 0 conflitos</b><span class="meta">Validação local concluída</span></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="toggleDrawer('review')">Abrir revisão F8</button></div>`}
function variantA(){return title()+toolbar()+`<div class="workspace card"><div class="tabs"><button id="tabFilters" class="tab active" onclick="showA('params')">1 · Filtros</button><button id="tabData" class="tab" onclick="showA('data')">2 · Dados <span class="badge bblue">6</span></button></div><div id="aContent" style="padding:10px">${filters()}<p class="meta">Defina os filtros e execute Gerar (F6). A aba Dados será aberta automaticamente.</p></div></div>`}
function variantB(){return title()+toolbar('<span class="badge bgreen">Filtros sempre visíveis</span>')+`<div class="workspace side-layout"><aside class="card sidebar"><h3>Contexto obrigatório</h3>${filters(true)}<h3>Filtros avançados</h3><button class="chip">Produtos (2 regras)</button> <button class="chip">Fornecedores</button><h3>Operação rápida</h3><div class="field"><label>Coluna</label><select><option>Promoção</option></select></div><div class="field"><label>Percentual</label><input value="-10,00%"></div><div class="field"><label>Validade</label><input value="31/08/2026"></div><div class="compact-actions"><button class="btn">Prévia</button><button class="btn primary">Aplicar</button></div></aside><section><div class="review"><strong>2 propostas</strong><span>Normal → Promoção, depois -10%. Nenhuma alteração foi gravada.</span><span class="spacer"></span><button class="btn" onclick="toggleDrawer('review')">Detalhar</button></div>${table()}</section></div>`}
function variantC(){return title()+toolbar('<button class="btn" onclick="toggleDrawer(\'filters\')">Filtros <span class="badge bblue">4 ativos</span></button>')+`<div class="workspace command-center"><section><div class="review"><span class="badge bgreen">Consulta atual</span><span>Matriz · ativos/em linha · Grupo Estofados · 6 registros</span><span class="spacer"></span><button class="btn" onclick="toggleDrawer('filters')">Alterar filtros</button></div>${table()}</section>${reviewBox()}</div>`}
function render(){document.getElementById('root').innerHTML=active==='A'?variantA():active==='B'?variantB():variantC();document.getElementById('variantLabel').textContent=`${active} — ${variants[active]}`;history.replaceState({},'',`?variant=${active}`)}
function cycle(d){const k=Object.keys(variants);active=k[(k.indexOf(active)+d+k.length)%k.length];render()}
let activeRow=1;function activateRow(id){activeRow=id;document.querySelectorAll('.sync-row').forEach(tr=>tr.classList.toggle('active',Number(tr.dataset.id)===id))}function wireScroll(){const boxes=[...document.querySelectorAll('.sync-scroll')];boxes.forEach(box=>box.onscroll=()=>{if(box.dataset.syncing)return;boxes.filter(x=>x!==box).forEach(x=>{x.dataset.syncing='1';x.scrollTop=box.scrollTop;requestAnimationFrame(()=>delete x.dataset.syncing)})})}
function selectRow(id,on){on?selected.add(id):selected.delete(id);document.getElementById('selCount').textContent=`${selected.size} selecionados`}
function selectAll(on){rows.forEach(r=>on?selected.add(r.id):selected.delete(r.id));render()}
function markChanged(id,el){rows.find(r=>r.id===id).changed=true;el.closest('tr').querySelector('td:last-child').innerHTML='<span class="badge bamber">Alterada</span>';document.getElementById('pendingCount').textContent=rows.filter(r=>r.changed).length}
function fakeGenerate(){if(active==='A'){showA('data');return}alert('Simulação: F6 manteria filtros, carregaria a coleção integral e substituiria o grid somente sem propostas pendentes.')}
function recalc(){alert('Simulação: projeções recalculadas; nenhuma nova mutação persistível foi criada.')}
function undo(){const r=[...rows].reverse().find(x=>x.changed);if(r){r.changed=false;render()}}
function showA(x){document.getElementById('aContent').innerHTML=x==='params'?filters()+`<p class="meta">Defina os filtros e execute Gerar (F6).</p>`:table();document.getElementById('tabFilters').classList.toggle('active',x==='params');document.getElementById('tabData').classList.toggle('active',x==='data');setTimeout(wireScroll,0)}
function toggleDrawer(kind){const d=document.getElementById('drawer'),o=document.getElementById('overlay');d.innerHTML=kind==='filters'?`<h2>Filtros da consulta</h2>${filters(true)}<button class="btn primary" style="width:100%;margin-top:12px" onclick="toggleDrawer()">Aplicar e gerar F6</button>`:kind==='ops'?`<h2>Operação em lote</h2><p class="meta">Afetará ${selected.size} linhas selecionadas.</p><div class="field"><label>Operação</label><select><option>Aplicar percentual / validade</option><option>Copiar coluna</option><option>Limpar coluna</option></select></div><div class="field"><label>Coluna</label><select><option>Promoção</option></select></div><div class="field"><label>Percentual</label><input value="-10,00%"></div><div class="field"><label>Validade</label><input value="31/08/2026"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="toggleDrawer()">Preparar operação</button>`:`<h2>Revisar e gravar</h2><div class="review"><strong>2 alterações</strong><span>Nada foi gravado ainda.</span></div><div class="summary-item"><b>Cadeira Luna</b>Promoção: R$ 449,00 → R$ 429,00</div><div class="summary-item"><b>Poltrona Serena</b>Promoção: R$ 809,00 → R$ 789,00</div><div class="summary-item"><b>Validação</b><span class="badge bgreen">Sem erros</span></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="alert('Simulação: aqui seria solicitada a autorização e o commit F8.')">Autorizar e gravar F8</button>`;d.classList.toggle('open',!!kind);o.classList.toggle('open',!!kind)}
document.getElementById('overlay').onclick=()=>toggleDrawer();document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);if(e.key==='F6'){e.preventDefault();fakeGenerate()}if(e.key==='F8'){e.preventDefault();toggleDrawer('review')}});active=new URLSearchParams(location.search).get('variant')||'A';if(!variants[active])active='A';render();
</script>
</body>
</html>
